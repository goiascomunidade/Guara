[project]
name = "guara"
version = "0.1.0"
description = "Guara voice-to-voice architecture foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
openai   = ["openai>=1.30.0"]
whisper  = ["faster-whisper>=1.0.0"]
deepgram = ["deepgram-sdk>=3.0.0"]
piper    = ["piper-tts>=1.4.0"]
all-providers = [
  "guara[openai]",
  "guara[whisper]",
  "guara[deepgram]",
  "guara[piper]",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
]
testpaths = [
  "tests",
]
asyncio_mode = "auto"

